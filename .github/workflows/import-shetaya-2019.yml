name: Import Shetaya 2019 raw dataset

on:
  push:
    paths:
      - ".github/workflows/import-shetaya-2019.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-dataset:
    runs-on: ubuntu-latest
    env:
      GH_REPO: davidlueng986-alt/scihub-papers
      DATASET_URL: https://data.mendeley.com/public-files/datasets/xw2kr7ykhd/files/13b5d059-1556-4563-8154-f1c510f4e7f5/file_downloaded
      DATASET_SHA256: e04adc7856ef0f607fd92805648725412850d5ef3c522da4a26b15bf4c39af60
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" repo
          cd repo
          git checkout main

      - name: Download, verify, extract and commit dataset
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          curl -L --fail --retry 3 "${DATASET_URL}" -o /tmp/DATA_FILES.zip
          ACTUAL="$(sha256sum /tmp/DATA_FILES.zip | awk '{print $1}')"
          test "$ACTUAL" = "${DATASET_SHA256}"

          ROOT="data/raw/shetaya_2019"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/extracted"
          cp /tmp/DATA_FILES.zip "$ROOT/DATA_FILES.zip"

          rm -rf /tmp/shetaya_extract
          mkdir -p /tmp/shetaya_extract
          unzip -q /tmp/DATA_FILES.zip -d /tmp/shetaya_extract
          cp -a "/tmp/shetaya_extract/DATA FILES/." "$ROOT/extracted/"

          cat > "$ROOT/SOURCE.md" <<'EOF'
# Shetaya et al. 2019 raw dataset

- Dataset: **Data for “Sorption kinetics of isotopically labelled divalent mercury (196Hg2+) in soil”**
- Mendeley Data DOI: https://doi.org/10.17632/xw2kr7ykhd.1
- Publisher file name: `DATA FILES.zip`
- Publisher file ID: `13b5d059-1556-4563-8154-f1c510f4e7f5`
- SHA256: `e04adc7856ef0f607fd92805648725412850d5ef3c522da4a26b15bf4c39af60`

The original ZIP is retained unchanged. Files under `extracted/` are direct extractions of that ZIP.
The uploaded copy supplied for this repository import was independently checked and had the same SHA256 as the publisher file.
EOF

          (
            cd "$ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then
            echo "Dataset already up to date."
            exit 0
          fi
          git commit -m "data: add Shetaya 2019 raw Mendeley dataset"
          git push origin HEAD:main
